<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <!-- Mobile viewport: prevent zoom, fill safe areas (iPhone notch/home bar) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Resident360" />
    <meta name="application-name" content="Resident360" />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="msapplication-navbutton-color" content="#1e1b4b" />

    <!-- Apple touch icon (shows on iOS home screen) -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Resident360 — Society Management" />
    <meta property="og:description" content="Complete society management for residents and admins" />
    <meta property="og:type" content="website" />

    <title>Resident360 — Society Management</title>

    <style>
      /* Prevent overscroll bounce on iOS, fill safe areas */
      html, body {
        height: 100%;
        overflow: hidden;
        background: #1e1b4b;
      }
      #root {
        height: 100%;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* Remove tap blue highlight on all elements */
      * { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
